s=\"brand\" id=\"headerTitle\"\u003e\u003c/div\u003e\u003cdiv class=\"small\" id=\"headerSub\"\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"topActions\"\u003e\u003cspan class=\"pill\" id=\"counter\"\u003e\u003c/span\u003e\u003cbutton id=\"fsBtn\"\u003eВо весь экран\u003c/button\u003e\u003cbutton id=\"restartBtn\"\u003eНовая игра\u003c/button\u003e\u003c/div\u003e\u003c/header\u003e\n\u003cmain\u003e\u003cdiv class=\"stage\"\u003e\u003csection class=\"panel visual\"\u003e\u003cdiv class=\"visualHeader\"\u003e\u003cspan id=\"pictureLabel\"\u003eИллюстрация / источник\u003c/span\u003e\u003cspan class=\"small\" id=\"pictureStatus\"\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"imageBody\"\u003e\u003cimg id=\"image\" class=\"hide\" alt=\"Иллюстрация к вопросу\"\u003e\u003cdiv id=\"imageEmpty\" class=\"emptyImg\"\u003e\u003cspan class=\"big\"\u003e◈\u003c/span\u003e\u003cspan id=\"emptyText\"\u003eОбсудите вопрос и обоснуйте ответ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"floating\"\u003e\u003cbutton id=\"zoomBtn\" aria-label=\"Увеличить изображение\"\u003e⤢\u003c/button\u003e\u003cbutton id=\"captionBtn\" aria-label=\"Описание изображения\"\u003ei\u003c/button\u003e\u003c/div\u003e\u003cdiv id=\"captionBubble\" class=\"captionBubble hide\"\u003e\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e\n\u003csection class=\"panel info\"\u003e\u003cdiv class=\"qArea\"\u003e\u003cdiv class=\"round\" id=\"roundLabel\"\u003e\u003c/div\u003e\u003ch1 class=\"question\" id=\"question\"\u003e\u003c/h1\u003e\u003c/div\u003e\u003cdiv class=\"timerArea\"\u003e\u003cdiv\u003e\u003cdiv class=\"time\" id=\"time\"\u003e01:00\u003c/div\u003e\u003cspan class=\"small\" id=\"timerState\"\u003eГотово\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"inline\"\u003e\u003cbutton id=\"timerBtn\" class=\"primary\"\u003eСтарт\u003c/button\u003e\u003cbutton id=\"timerResetBtn\"\u003eСброс\u003c/button\u003e\u003cbutton id=\"hintBtn\"\u003eПодсказка\u003c/button\u003e\u003cbu }catch(e){}}\nfunction notify(str){$('toast').textContent=str;$('toast').classList.remove('hide');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=\u003e$('toast').classList.add('hide'),2000);}\nfunction modal(id,show=true){$(id).classList.toggle('show',show);}\nfunction hideAllModals(){['lightbox','partialModal','teamsModal'].forEach(id=\u003emodal(id,false));}\nfunction stopTimer(){if(interval)clearInterval(interval);interval=null;deadline=null;}\nfunction drawTime(){const t=duration();$('time').textContent=t?formatTime(state.remaining):'Без таймера';$('time').classList.toggle('expired',t\u0026\u0026state.remaining===0);$('timerState').textContent=!t?'Ограничение времени отключено':interval?'Идет отсчет':state.remaining===0?'Время истекло':'Готово / пауза';$('timerBtn').textContent=interval?'Пауза':'Старт';$('timerBtn').disabled=!t;}\nfunction tick(){if(deadline===null)return;state.remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(state.remaining===0){stopTimer();notify('Время истекло');}drawTime();}\nfunction timerToggle(){if(!duration())return;if(interval){tick();stopTimer();drawTime();return;}if(state.remaining\u003c=0)state.remaining=duration();deadline=Date.now()+state.remaining*1000;interval=setInterval(tick,200);drawTime();}\nfunction timerReset(){stopTimer();state.remaining=duration();drawTime();}\nfunction onQuestionChange(){stopTimer();state.showHint=false;state.showAnswer=false;state.remaining=duration();draw();save();}\nfunction draw(){const q=current();if(!q){$('question').textContent='В этой игре еще нет вопросов';return;}document.body.className=(s.theme==='dark'?'theme-dark':s.theme==='warm'?'theme-warm':'')+(document.fullscreenElement?' full':'');\n$('headerTitle').textContent=m.title||'Учебная викторина';$('headerSub').textContent=[m.subject,m.grade].filter(Boolean).join(' · ');$('counter').textContent=(state.idx+1)+' / '+questions.length;\n$('roundLabel').textContent=q.round+' · '+maxPts()+' балл.';$('question').textContent=q.question||'Вопрос без текста';\nconst hasImage=typeof q.image==='string'\u0026\u0026/^data:image\\/(?:png|jpeg|webp|gif);base64,/i.test(q.image);document.querySelector('.stage').classList.toggle('textOnly',!hasImage);$('image').classList.toggle('hide',!hasImage);$('imageEmpty').classList.toggle('hide',hasImage);$('zoomBtn').disabled=!hasImage;\nif(hasImage){$('image').src=q.image;$('bigImage').src=q.image;}else{$('image').removeAttribute('src');$('bigImage').removeAttribute('src');}\n$('captionBtn').disabled=!(q.caption||'').trim();$('captionBubble').textContent=q.caption||'';$('captionBubble').classList.add('hide');$('lightCaption').textContent=q.caption||'';\n$('hintContent').textContent=q.hint||'Подсказка не предусмотрена';$('answerContent').textContent=q.answer||'Ответ не указан';$('rubricContent').textContent=q.rubric||'Полный ответ: '+maxPts()+' балл.';\n$('hintBox').classList.toggle('hide',!state.showHint);$('answerBox').classList.toggle('hide',!state.showAnswer);$('rubricBox').classList.toggle('hide',!state.showAnswer);\n$('hintBtn').textContent=state.showHint?'Скрыть подсказку':'Подсказка';$('answerBtn').textContent=state.showAnswer?'Скрыть ответ':'Ответ';\nconst done=state.done[q.id];$('pictureStatus').textContent=done?'✓ Вопрос сыгран':'';$('status').textContent=done?(done.team\u003e=0?'Ответила: '+state.names[done.team]+' · +'+done.points:'Никто не ответил'):'Начислите баллы команде, давшей правильный ответ.';\n$('teams').innerHTML=state.names.map((name,i)=\u003e`\u003cdiv class=\"team ${i===state.turn%state.names.length?'turn':''} ${done\u0026\u0026done.team===i?'earned':''}\"\u003e\u003cdiv class=\"tname\"\u003e${escapeHTML(name)}\u003c/div\u003e\u003cdiv class=\"points\"\u003e${state.score[i]}\u003c/div\u003e\u003cbutton data-award=\"${i}\" ${done?'disabled':''}\u003eПолный ответ · +${maxPts()}\u003c/button\u003e\u003c/div\u003e`).join('');\n$('partialBtn').disabled=!!done;$('noneBtn').disabled=!!done;$('prevBtn').disabled=state.idx===0;$('nextBtn').textContent=state.idx===questions.length-1?'Итоги →':'Далее →';drawTime();}\nfunction award(i,p,kind){const q=current();if(state.done[q.id]){notify('Этот вопрос уже сыгран');return;}state.log.push({qid:q.id,idx:state.idx,scores:[...state.score],turn:state.turn});state.done[q.id]={team:i,points:p,kind};if(i\u003e=0)state.score[i]+=p;state.turn++;stopTimer();modal('partialModal',false);draw();save();notify(i\u003e=0?'Начислено '+p+' балл.':'Вопрос завершен без баллов');}\nfunction undo(){const prev=state.log.pop();if(!prev){notify('Начислений для отмены нет');return;}state.idx=prev.idx;state.score=prev.scores;state.turn=prev.turn;delete state.done[prev.qid];onQuestionChange();notify('Последнее начисление отменено');}\nfunction finish(){stopTimer();state.finished=true;save();const max=Math.max(...state.score);const winners=state.names.filter((_,i)=\u003estate.score[i]===max);$('finishTitle').textContent=winners.length===1?'Победитель — '+winners[0]:'Победители — '+winners.join(', ');$('ranking').innerHTML=state.names.map((name,i)=\u003e({name,score:state.score[i]})).sort((a,b)=\u003eb.score-a.score).map((x,i)=\u003e`\u003cdiv class=\"ranking\"\u003e${i+1}. ${escapeHTML(x.name)} — ${x.score} балл.\u003c/div\u003e`).join('');$('reflection').textContent=m.reflection||'Что нового вы узнали? Какой вопрос оказался самым интересным?';modal('finish');}\nfunction reset(){if(!confirm('Начать заново? Все баллы и результаты текущей партии будут сброшены.'))return;stopTimer();state={idx:0,score:baseNames.map(()=\u003e0),names:[...baseNames],done:{},log:[],turn:0,showHint:false,showAnswer:false,remaining:0,started:false,finished:false};save();onQuestionChange();modal('finish',false);modal('welcome');}\nfunction enterFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=\u003e{});else document.exitFullscreen?.().catch(()=\u003e{});}\nfunction openTeams(){const fields=state.names.map((name,i)=\u003e`\u003clabel for=\"newteam${i}\"\u003eКоманда ${i+1}\u003c/label\u003e\u003cinput id=\"newteam${i}\" maxlength=\"48\" value=\"${escapeHTML(name)}\"\u003e`).join('');$('teamNames').innerHTML=fields;modal('teamsModal');}\nfunction openPartial(){const done=state.done[current().id];if(done)return;const max=maxPts();$('partialGrid').innerHTML=state.names.map((name,i)=\u003e`\u003cdiv class=\"ranking\"\u003e\u003cstrong\u003e${escapeHTML(name)}\u003c/strong\u003e\u003cdiv class=\"inline\" style=\"margin-top:8px\"\u003e${Array.from({length:Math.min(max-1,19)},(_,k)=\u003e`\u003cbutton data-team=\"${i}\" data-part=\"${k+1}\"\u003e+${k+1}\u003c/button\u003e`).join('')||'\u003cspan\u003eЧастичные баллы не предусмотрены\u003c/span\u003e'}\u003c/div\u003e\u003c/div\u003e`).join('');modal('partialModal');}\n$('introKicker').textContent=m.kicker||'История на Ты · интерактивная игра';$('introTitle').textContent=m.title||'Учебная игра';$('introSubtitle').textContent=m.subtitle||'';$('introDescription').textContent=m.description||'Отвечайте на вопросы, объясняйте свою точку зрения и набирайте баллы.';\n$('introStats').innerHTML=`\u003cspan\u003e${questions.length} вопросов\u003c/span\u003e\u003cspan\u003e${rs.length} раундов\u003c/span\u003e\u003cspan\u003e${baseNames.length} команд\u003c/span\u003e`;\n$('beginBtn').onclick=()=\u003e{state.started=true;modal('welcome',false);save();};$('introFsBtn').onclick=enterFullscreen;$('fsBtn').onclick=enterFullscreen;\n$('introTeamsBtn').onclick=openTeams;$('teamSettingsBtn').onclick=openTeams;$('teamNamesSave').onclick=()=\u003e{state.names=state.names.map((name,i)=\u003e($('newteam'+i)?.value||'').trim()||name);modal('teamsModal',false);draw();save();};\n$('restartBtn').onclick=reset;$('finishRestart').onclick=reset;$('finishClose').onclick=()=\u003emodal('finish',false);\n$('timerBtn').onclick=timerToggle;$('timerResetBtn').onclick=timerReset;$('hintBtn').onclick=()=\u003e{state.showHint=!state.showHint;draw();save();};$('answerBtn').onclick=()=\u003e{state.showAnswer=!state.showAns const escapeHTML=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>('id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,10));
const sample=()=>({version:2,id:uid(),meta:{title:'Гуманитарная викторина',subtitle:'Игра по истории, обществоведению, литературе или культуре',subject:'История / обществоведение',grade:'',kicker:'Интеллектуальная игра · История на Ты',description:'Рассмотрите иллюстрации или прочитайте вопросы. Дайте ответ и объясните свою позицию. За полный ответ команда получает указанное количество баллов.',reflection:'Какой вывод вы сделали по теме? Какие факты помогли его обосновать?'},settings:{teams:['Команда 1','Команда 2','Команда 3'],timer:60,theme:'blue'},rounds:[{id:uid(),name:'Разминка',questions:[{id:uid(),question:'Что такое исторический источник? Приведите пример письменного и вещественного источника.',answer:'Исторический источник — свидетельство, по которому изучают прошлое. Письменный пример: летопись; вещественный: орудие труда или монета.',hint:'Подумайте, какие следы прошлых эпох дошли до наших дней.',rubric:'1 балл — определение, 1 балл — два верных примера.',caption:'',image:'',points:2,timer:0}]},{id:uid(),name:'Работаем с фактами',questions:[{id:uid(),question:'Почему при работе с историческим документом важно выяснить, кто, когда и с какой целью его создал?',answer:'Авторство, время и цель помогают понять контекст, возможную позицию автора и ограничения источника.',hint:'Сравните личное письмо и официальный отчет.',rubric:'1 балл — контекст, 1 балл — возможная позиция или цель автора.',caption:'',image:'',points:2,timer:0}]}]});
let data=sample(),active='about',currentRoundId=data.rounds[0].id,currentQuestionId=data.rounds[0].questions[0].id;
let dbPromise=null,saveTimer=null,noticeTimer=null,autosaveBusy=false;
function note(message){$('toast').textContent=message;$('toast').classList.remove('hidden');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('toast').classList.add('hidden'),3900);}
function filename(s){return String(s||'uchebnaya_igra').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^\p{L}\p{N}_-]+/gu,'_').slice(0,65)||'uchebnaya_igra';}
function allQuestions(){return data.rounds.flatMap(r=>r.questions.map(q=>({...q,roundName:r.name})));}
function sumSize(){return new Blob([JSON.stringify(data)]).size;}
function bytes(b){return b>1024*1024?(b/1024/1024).toFixed(1)+' МБ':Math.round(b/1024)+' КБ';}
function question(){return data.rounds.flatMap(r=>r.questions).find(q=>q.id===currentQuestionId);}
function selectedRound(){return data.rounds.find(r=>r.id===currentRoundId)||data.rounds[0];}
function openDB(){if(dbPromise)return dbPromise;dbPromise=new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(Error('IndexedDB недоступен'));return;}const req=indexedDB.open('istorya_quiz_builder_v2',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('projects'))req.result.createObjectStore('projects');};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});return dbPromise;}
async function dbSave(){const db=await openDB();await new Promise((resolve,reject)=>{const tx=db.transaction('projects','readwrite');tx.objectStore('projects').put(data,'latest');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}
async function dbLoad(){const db=await openDB();return await new Promise((resolve,reject)=>{const tx=db.transaction('projects','readonly');const r=tx.objectStore('projects').get('latest');r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error);});}
function scheduleSave(){clearTimeout(saveTimer);$('saveStatus').textContent='Есть изменения…';saveTimer=setTimeout(async()=>{if(autosaveBusy)return scheduleSave();autosaveBusy=true;try{await dbSave();$('saveStatus').textContent='Автосохранение выполнено';$('saveStatus').classList.remove('warning');}catch(e){try{if(sumSize()<2000000){localStorage.setItem('istorya_builder_fallback',JSON.stringify(data));$('saveStatus').textContent='Сохранено в браузере';}else{throw Error('Проект слишком большой');}}catch(err){$('saveStatus').textContent='Сохраните проект вручную';$('saveStatus').classList.add('warning');}}finally{autosaveBusy=false;}},900);}
function download(text,name,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function jsonForHTML(obj){return JSON.stringify(obj).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');}
function exportHTML(){return GAME_SHELL.replace('__GAME_DATA__',jsonForHTML(data)).replace('<title>Учебная викторина · История на Ты</title>','<title>'+escapeHTML(data.meta.title||'Учебная викторина')+'</title>');}
function saveJSON(){download(JSON.stringify(data,null,2),filename(data.meta.title)+'_proekt.json','application/json;charset=utf-8');note('Проект JSON сохранен. В нем сохраняются все вопросы и изображения.');}
function exportGame(){const faults=validate().filter(v=>v.type==='error');if(faults.length){go('export');note('Сначала исправьте обязательные поля: '+faults.length+' замечаний');return;}download(exportHTML(),filename(data.meta.title)+'_igra_offline.html','text/html;charset=utf-8');note('Готовая автономная игра скачана. Откройте HTML двойным щелчком.');}
function preview(){const faults=validate().filter(v=>v.type==='error');if(faults.length){go('export');note('Исправьте ошибки перед просмотром.');return;}const blob=new Blob([exportHTML()],{type:'text/html'});const url=URL.createObjectURL(blob);const w=window.open(url,'_blank');if(!w)note('Браузер заблокировал вкладку. Разрешите всплывающие окна или скачайте HTML.');setTimeout(()=>URL.revokeObjectURL(url),120000);}
function legacyToNew(doc){const payload=doc.querySelector('script#data[type="application/json"]');if(!payload)throw Error('В HTML не найдено содержимое старой игры.');const old=JSON.parse(payload.textContent);if(!Array.isArray(old.items))throw Error('Не найден массив вопросов.');const x=sample();x.meta.title=doc.title.replace(/\s*·\s*v\d+.*$/,'')||'Импортированная викторина';x.meta.subtitle='Игра, перенесенная из исходного HTML';x.meta.subject='История';x.meta.description='Отвечайте на вопросы по изображениям и историческим источникам.';x.rounds=[];let lastRound='';old.items.forEach((it,i)=>{const rname=String(it.round||'Раунд');if(lastRound!==rname){x.rounds.push({id:uid(),name:rname,questions:[]});lastRound=rname;}const rubric=String(it.rubric||'');const pts=[...rubric.matchAll(/(?<!\d)(\d+)\s*(?:балл[а-я]*)?\s*[—–-]/gi)].reduce((a,m)=>a+Number(m[1]),0)||(i>=22?3:2);const photo=typeof it.img==='string'?((old.images||{})[it.img]||it.img):'';x.rounds.at(-1).questions.push({id:uid(),question:String(it.q||''),answer:String(it.a||''),hint:String(it.hint||''),rubric,caption:String(it.caption||''),image:/^data:image\/(?:png|jpeg|webp|gif);base64,/i.test(photo)?photo:'',points:pts,timer:0});});return x;}
function normalize(obj){if(!obj||typeof obj!=='object'||!Array.isArray(obj.rounds))throw Error('Некорректная структура проекта.');const x=structuredClone(obj);x.version=2;x.id=String(x.id||uid());x.meta={...sample().meta,...(x.meta||{})};x.settings={...sample().settings,...(x.settings||{})};x.settings.teams=Array.isArray(x.settings.teams)&&x.settings.teams.length?x.settings.teams.slice(0,6).map(String):['Команда 1'];x.rounds=x.rounds.map(r=>({id:String(r.id||uid()),name:String(r.name||'Раунд'),questions:(Array.isArray(r.questions)?r.questions:[]).map(q=>({id:String(q.id||uid()),question:String(q.question||''),answer:String(q.answer||''),hint:String(q.hint||''),rubric:String(q.rubric||''),caption:String(q.caption||''),image:typeof q.image==='string'&&/^data:image\/(?:png|jpeg|webp|gif);base64,/i.test(q.image)?q.image:'',points:Math.max(1,Math.min(20,Number(q.points)||2)),timer:Math.max(0,Math.min(3600,Number(q.timer)||0))}))}));return x;}
async function readProject(file){if(!file)return;try{const text=await file.text();let x;if(/\.html?$/i.test(file.name)||/^\s*<!doctype html/i.test(text)||/^\s*<html/i.test(text)){const doc=new DOMParser().parseFromString(text,'text/html');const embedded=doc.querySelector('script#game-data[type="application/json"]');x=embedded?JSON.parse(embedded.textContent):legacyToNew(doc);}else{x=JSON.parse(text);}if(!confirm('Заменить текущий проект данными из файла «'+file.name+'»?'))return;data=normalize(x);currentRoundId=data.rounds[0]?.id||null;currentQuestionId=data.rounds[0]?.questions[0]?.id||null;go('about');scheduleSave();note('Импортировано '+allQuestions().length+' вопросов, '+data.rounds.length+' раундов.');}catch(e){alert('Не удалось импортировать файл. '+e.message);}finally{$('importInput').value='';}}
function field(name,label,value,kind='input',hint='',other=''){const id='f_'+name;return `<div class="field"><label for="${id}">${label}</label>${kind==='textarea'?`<textarea id="${id}" ${other} data-meta="${name}">${escapeHTML(value)}</textarea>`:`<input id="${id}" data-meta="${name}" value="${escapeHTML(value)}" ${other}>`}${hint?`<div class="hint">${hint}</div>`:''}</div>`;}
function navHighlight(){document.querySelectorAll('[data-nav]').forEach(el=>el.classList.toggle('active',el.dataset.nav===active));}
function go(tab){active=tab;navHighlight();render();window.scrollTo({top:0,behavior:'instant'});}
function render(){const ws=$('workspace');if(active==='about')ws.innerHTML=aboutView();if(active==='rounds')ws.innerHTML=roundsView();if(active==='questions')ws.innerHTML=questionsView();if(active==='settings')ws.innerHTML=settingsView();if(active==='export')ws.innerHTML=exportView();}
function heading(title,subtitle){return `<h1 class="sectionTitle">${title}</h1><p class="sectionLead">${subtitle}</p>`;}
function bottomNav(prev,next){return `<div class="footerToolbar"><button data-nav="${prev}">← Назад</button><button data-nav="${next}" class="primary">Далее →</button></div>`;}
function aboutView(){const m=data.meta;return heading('Об игре','Введите название и коротко объясните правила для учащихся. Все надписи можно менять.')+`<section class="panel"><h2>Название и содержание</h2>${field('title','Название игры *',m.title,'input','','required maxlength="150"')}<div style="height:14px"></div>${field('subtitle','Подзаголовок',m.subtitle,'textarea','Будет показан на стартовом экране.','rows="2"')}<div class="grid2" style="margin-top:15px">${field('subject','Предмет / тема',m.subject)}${field('grade','Класс или аудитория',m.grade)}</div></section><section class="panel"><h2>Стартовый экран</h2>${field('kicker','Надпись над названием',m.kicker)}<div style="height:14px"></div>${field('description','Описание игры / правила',m.description,'textarea','','rows="4"')}<div style="height:14px"></div>${field('reflection','Итоговый вопрос для обсуждения',m.reflection,'textarea','','rows="3"')}</section>`+bottomNav('export','rounds');}
function roundsView(){return heading('Раунды','Сгруппируйте задания по смыслу: «Разминка», «Источники», «Личности», «Работа с картой» и т. д.')+`<section class="panel"><div class="rowBetween"><h2 style="margin:0">Раунды: ${data.rounds.length}</h2><button id="addRound" class="primary">+ Добавить раунд</button></div><div class="roundGrid" style="margin-top:16px">${data.rounds.map((r,i)=>`<div class="roundRow"><div class="field"><label for="round_${i}">Раунд ${i+1} · ${r.questions.length} вопросов</label><input id="round_${i}" data-round-name="${escapeHTML(r.id)}" value="${escapeHTML(r.name)}"></div><div class="actions"><button class="smallBtn" data-round-action="up" data-round-id="${escapeHTML(r.id)}" title="Выше" ${i===0?'disabled':''}>↑</button><button class="smallBtn" data-round-action="down" data-round-id="${escapeHTML(r.id)}" title="Ниже" ${i===data.rounds.length-1?'disabled':''}>↓</button><button class="smallBtn" data-round-action="addq" data-round-id="${escapeHTML(r.id)}">+ Вопрос</button><button class="smallBtn danger" data-round-action="remove" data-round-id="${escapeHTML(r.id)}">Удалить</button></div></div>`).join('')}</div><div class="tip" style="margin-top:16px">Изменения названий сохраняются автоматически. Вы можете добавлять столько раундов и вопросов, сколько требуется.</div></section>`+bottomNav('about','questions');}
function questionsView(){const q=question();return heading('Вопросы и материалы','Добавляйте вопросы, подсказки, ответы и картинки. Тексты можно копировать из учебника или готовых заданий.')+`<section class="panel"><div class="rowBetween"><h2 style="margin:0">Задания: ${allQuestions().length}</h2><button id="addQuestion" class="primary">+ Добавить вопрос</button></div><div class="questionsLayout" style="margin-top:18px"><div class="questionList">${data.rounds.map(r=>`<div class="roundHead"><span class="headTxt">${escapeHTML(r.name)}</span><small>${r.questions.length} вопросов</small><div class="actions"><button class="smallBtn" data-add-q-round="${escapeHTML(r.id)}">+ Вопрос в раунд</button></div></div>${r.questions.map((x,i)=>`<button class="questionItem ${x.id===currentQuestionId?'selected':''}" data-select-q="${escapeHTML(x.id)}"><small>Вопрос ${i+1} · ${Number(x.points)||2} балл.</small>${escapeHTML(x.question.slice(0,95)||'Новый вопрос')}</button>`).join('')}`).join('')}</div><div class="questionEditor">${q?questionEditor(q):'<div class="editorPlaceholder">Создайте первый вопрос кнопкой слева или сверху.</div>'}</div></div></section>`+bottomNav('rounds','settings');}
function questionEditor(q){const r=data.rounds.find(r=>r.questions.some(x=>x.id===q.id));const idx=r.questions.findIndex(x=>x.id===q.id);const num=idx+1;const inField=(k,l,kind='textarea',extra='')=>`<div class="field"><label for="q_${k}">${l}</label>${kind==='textarea'?`<textarea id="q_${k}" rows="${extra||3}" data-q-field="${k}">${escapeHTML(q[k]||'')}</textarea>`:`<input id="q_${k}" type="${kind}" data-q-field="${k}" value="${escapeHTML(q[k]??'')}">`}</div>`;
return `<div class="rowBetween"><h3>${escapeHTML(r.name)} · вопрос ${num}</h3><div class="actions"><button class="smallBtn" data-q-action="up" ${idx===0?'disabled':''}>↑</button><button class="smallBtn" data-q-action="down" ${idx===r.questions.length-1?'disabled':''}>↓</button><button class="smallBtn" data-q-action="copy">Дублировать</button><button class="smallBtn danger" data-q-action="remove">Удалить</button></div></div>${inField('question','Формулировка вопроса *','textarea',4)}<div class="separator"></div><div class="grid2">${inField('hint','Подсказка','textarea',3)}${inField('answer','Образец правильного ответа *','textarea',3)}</div><div style="height:15px"></div>${inField('rubric','Критерии оценивания','textarea',2)}<div class="grid2" style="margin-top:15px"><div class="field"><label for="q_points">Максимум баллов за вопрос</label><input id="q_points" type="number" min="1" max="20" data-q-field="points" value="${q.points}"></div><div class="field"><label for="q_timer">Время на вопрос (в секундах)</label><input id="q_timer" type="number" min="0" max="3600" data-q-field="timer" value="${q.timer||0}"><div class="hint">0 = как в общих настройках</div></div></div><div class="separator"></div><h3>Изображение или источник (необязательно)</h3><div class="upload"><label for="imageFile"><strong>Выберите изображение с компьютера</strong></label><p class="muted textSmall">JPG, PNG, WEBP или GIF. Фото, карта, иллюстрация, страница документа.</p><input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><div class="imagePreview">${q.image?`<img src="${escapeHTML(q.image)}" alt="Загруженный материал"><button id="removeImage" class="danger smallBtn">Удалить изображение</button>`:'<span class="muted">Пока без иллюстрации — это допустимо.</span>'}</div></div><div style="height:14px"></div>${inField('caption','Описание / подпись к изображению','textarea',3)}<div class="hint">Учащиеся смогут увеличить изображение, а учитель — открыть пояснение по кнопке «i».</div><div class="separator"></div><div class="field"><label for="moveRound">Перенести вопрос в другой раунд</label><select id="moveRound">${data.rounds.map(x=>`<option value="${escapeHTML(x.id)}" ${x.id===r.id?'selected':''}>${escapeHTML(x.name)}</option>`).join('')}</select></div>`;
}
function settingsView(){const s=data.settings;return heading('Настройки игры','Выберите оформление, команды и ограничения времени. Остальное игра сделает автоматически.')+`<section class="panel"><h2>Команды</h2><div class="grid2"><div class="field"><label for="teamCount">Количество команд</label><select id="teamCount">${[1,2,3,4,5,6].map(n=>`<option ${n===s.teams.length?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label for="timerDefault">Время на вопрос (секунд)</label><input id="timerDefault" type="number" min="0" max="3600" value="${s.timer}"><div class="hint">0 = без отсчета времени. У каждого вопроса можно указать свое время.</div></div></div><div class="grid2" style="margin-top:16px">${s.teams.map((name,i)=>`<div class="field"><label for="team_${i}">Название команды ${i+1}</label><input id="team_${i}" data-team-index="${i}" maxlength="48" value="${escapeHTML(name)}"></div>`).join('')}</div></section><section class="panel"><h2>Цветовая тема</h2><div class="grid3">${[['blue','Светлая синяя','Четкая, для электронной доски'],['warm','Теплая','Для истории, литературы, культуры'],['dark','Темная','Для затемненного помещения']].map(([key,name,descr])=>`<label style="border:2px solid ${s.theme===key?'var(--main)':'var(--line)'};border-radius:14px;padding:17px;cursor:pointer"><input type="radio" name="theme" value="${key}" ${s.theme===key?'checked':''}><strong style="display:block;margin:8px 0">${name}</strong><span class="hint">${descr}</span></label>`).join('')}</div></section><section class="panel"><h2>Что будет в готовой игре</h2><div class="tip">Заставка · один экран для ведущего · раунды · таймер · увеличение изображения · подпись «i» · подсказка · образец ответа · критерии · начисление полного и частичного балла · отмена · итоги · полноэкранный режим · сохранение счета на устройстве.</div></section>`+bottomNav('questions','export');}
function validate(){const errors=[];if(!(data.meta.title||'').trim())errors.push({type:'error',text:'Не указано название игры.'});if(!data.rounds.length)errors.push({type:'error',text:'Добавьте хотя бы один раунд.'});const qs=allQuestions();if(!qs.length)errors.push({type:'error',text:'Добавьте хотя бы один вопрос.'});data.rounds.forEach((r,i)=>{if(!r.name.trim())errors.push({type:'error',text:`Раунд ${i+1}: нет названия.`});r.questions.forEach((q,j)=>{if(!(q.question||'').trim())errors.push({type:'error',text:`Раунд «${r.name}», вопрос ${j+1}: нет текста вопроса.`});if(!(q.answer||'').trim())errors.push({type:'error',text:`Раунд «${r.name}», вопрос ${j+1}: отсутствует образец ответа.`});if(!q.hint.trim())errors.push({type:'warning',text:`Раунд «${r.name}», вопрос ${j+1}: нет подсказки (это допустимо).`});if(q.image&&!q.caption.trim())errors.push({type:'warning',text:`Раунд «${r.name}», вопрос ${j+1}: к изображению нет подписи.`});});});return errors;}
function exportView(){const check=validate(),errors=check.filter(x=>x.type==='error'),warnings=check.filter(x=>x.type==='warning');const n=allQuestions().length;const images=allQuestions().filter(q=>q.image).length;return heading('Проверка и экспорт','Конструктор соберет отдельный HTML-файл со всеми вопросами и изображениями внутри.')+`<section class="panel"><div class="rowBetween"><h2 style="margin:0">Ваш проект</h2><span class="badge">${errors.length?'Нужны исправления':'Готов к экспорту'}</span></div><div class="stats"><div class="summaryStat"><strong>${data.rounds.length}</strong>раундов</div><div class="summaryStat"><strong>${n}</strong>вопросов</div><div class="summaryStat"><strong>${images}</strong>изображений</div><div class="summaryStat"><strong>${data.settings.teams.length}</strong>команд</div><div class="summaryStat"><strong>${bytes(sumSize())}</strong>размер данных</div></div><div class="prePreview"><div class="muted">Так увидят учащиеся на заставке:</div><h2>${escapeHTML(data.meta.title||'Без названия')}</h2><p>${escapeHTML(data.meta.subtitle||'')}</p><div class="stats"><span class="badge">${n} вопросов</span><span class="badge">${data.rounds.length} раундов</span><span class="badge">${data.settings.teams.length} команд</span></div></div></section><section class="panel"><h2>Проверка содержания</h2>${!check.length?'<div class="validation success"><span class="dot">✓</span>Все обязательные поля заполнены. Проверьте историческую и предметную точность текстов самостоятельно.</div>':`<div class="muted textSmall">Ошибки: ${errors.length}; рекомендации: ${warnings.length}</div>${check.slice(0,25).map(v=>`<div class="validation ${v.type==='error'?'warning':'muted'}"><span class="dot">${v.type==='error'?'!':'i'}</span><span>${escapeHTML(v.text)}</span></div>`).join('')}${check.length>25?`<p>И еще ${check.length-25} замечаний.</p>`:''}`}</section><section class="panel"><h2>Получить результат</h2><p class="muted">В готовом HTML нет ссылок на внешние библиотеки. Фотографии, карты, документы и вопросы встроены в сам файл.</p><div class="fileActions"><strong>1. Проверьте игру</strong><p class="muted">Откроется отдельная вкладка с той игрой, которую получат учащиеся.</p><div class="actions"><button id="previewBtn" ${errors.length?'disabled':''}>▶ Пробный запуск</button></div></div><div class="fileActions"><strong>2. Скачайте HTML для урока</strong><p class="muted">Один файл — его можно перенести на флешке, открыть на компьютере или разместить на GitHub Pages.</p><div class="actions"><button id="exportBtn" class="primary" ${errors.length?'disabled':''}>↓ Скачать готовую HTML-игру</button></div></div><div class="fileActions"><strong>3. Сохраните редактируемый проект</strong><p class="muted">Файл JSON нужен, если вы планируете менять вопросы позже или перейти на другой компьютер.</p><div class="actions"><button id="saveProjectBtn">↓ Сохранить проект JSON</button><button id="loadProjectBtn">↑ Открыть ранее сохраненный</button></div></div><div class="alert">Не путайте файлы: <strong>HTML — для проведения игры, JSON — для дальнейшего редактирования.</strong> Конструктор может также импортировать HTML старого образца и свои готовые HTML-игры.</div></section>`+bottomNav('settings','about');}
function mutateRound(id,action){const i=data.rounds.findIndex(r=>r.id===id);if(i<0)return;const r=data.rounds[i];if(action==='addq'){addQuestion(id);return;}if(action==='remove'){if(!confirm('Удалить раунд «'+r.name+'» вместе с '+r.questions.length+' вопросами?'))return;data.rounds.splice(i,1);if(!data.rounds.length){data.rounds.push({id:uid(),name:'Новый раунд',questions:[]});}currentRoundId=data.rounds[0].id;currentQuestionId=data.rounds[0].questions[0]?.id||null;}if(action==='up'&&i>0)[data.rounds[i-1],data.rounds[i]]=[data.rounds[i],data.rounds[i-1]];if(action==='down'&&i<data.rounds.length-1)[data.rounds[i],data.rounds[i+1]]=[data.rounds[i+1],data.rounds[i]];render();scheduleSave();}
function addQuestion(roundId=null){const r=data.rounds.find(x=>x.id===roundId)||selectedRound();if(!r){note('Сначала создайте раунд');go('rounds');return;}const q={id:uid(),question:'',answer:'',hint:'',rubric:'',caption:'',image:'',points:2,timer:0};r.questions.push(q);currentRoundId=r.id;currentQuestionId=q.id;go('questions');scheduleSave();setTimeout(()=>$('q_question')?.focus(),20);}
function mutateQuestion(action){const q=question();if(!q)return;const r=data.rounds.find(x=>x.questions.includes(q));const i=r.questions.indexOf(q);if(action==='copy'){const copy={...q,id:uid(),question:q.question+' (копия)'};r.questions.splice(i+1,0,copy);currentQuestionId=copy.id;}if(action==='remove'){if(!confirm('Удалить выбранный вопрос?'))return;r.questions.splice(i,1);currentQuestionId=r.questions[i]?.id||r.questions[i-1]?.id||data.rounds.flatMap(x=>x.questions)[0]?.id||null;}if(action==='up'&&i>0)[r.questions[i-1],r.questions[i]]=[r.questions[i],r.questions[i-1]];if(action==='down'&&i<r.questions.length-1)[r.questions[i],r.questions[i+1]]=[r.questions[i+1],r.questions[i]];render();scheduleSave();}
function moveQuestion(toRound){const q=question();if(!q)return;const old=data.rounds.find(r=>r.questions.includes(q));const dest=data.rounds.find(r=>r.id===toRound);if(!dest||dest===old)return;old.questions.splice(old.questions.indexOf(q),1);dest.questions.push(q);currentRoundId=dest.id;render();scheduleSave();}
async function addImage(file){if(!file)return;if(!['image/jpeg','image/png','image/webp','image/gif'].includes(file.type)){note('Нужен JPG, PNG, WEBP или GIF. Другой формат не поддерживается.');return;}if(file.size>18000000){note('Изображение больше 18 МБ. Сначала уменьшите его размер.');return;}const wanted=currentQuestionId;const reader=new FileReader();reader.onload=()=>{const target=data.rounds.flatMap(r=>r.questions).find(q=>q.id===wanted);if(!target)return;target.image=String(reader.result||'');if(target.image.length>3400000)note('Крупное изображение встроено в проект. Итоговый HTML может быть большим.');render();scheduleSave();};reader.onerror=()=>note('Не удалось прочитать изображение.');reader.readAsDataURL(file);}
const ws=$('workspace');
ws.addEventListener('input',e=>{const t=e.target;if(t.dataset.meta){data.meta[t.dataset.meta]=t.value;scheduleSave();return;}if(t.dataset.qField){const q=question();if(q){const field=t.dataset.qField;q[field]=['points','timer'].includes(field)?Math.max(0,Math.min(field==='points'?20:3600,Number(t.value)||0)):t.value;scheduleSave();}return;}if(t.dataset.roundName){const r=data.rounds.find(x=>x.id===t.dataset.roundName);if(r){r.name=t.value;scheduleSave();}return;}if(t.dataset.teamIndex!==undefined){data.settings.teams[+t.dataset.teamIndex]=t.value;scheduleSave();return;}if(t.id==='timerDefault'){data.settings.timer=Math.max(0,Math.min(3600,Number(t.value)||0));scheduleSave();}});
ws.addEventListener('change',e=>{const t=e.target;if(t.id==='teamCount'){const n=+t.value;while(data.settings.teams.length<n)data.settings.teams.push('Команда '+(data.settings.teams.length+1));data.settings.teams.length=n;render();scheduleSave();}if(t.name==='theme'){data.settings.theme=t.value;render();scheduleSave();}if(t.id==='imageFile')addImage(t.files[0]);if(t.id==='moveRound')moveQuestion(t.value);if(t.dataset.qField==='points'&&!Number(t.value)){question().points=1;t.value='1';scheduleSave();}});
ws.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.nav){go(btn.dataset.nav);return;}if(btn.id==='addRound'){const r={id:uid(),name:'Новый раунд '+(data.rounds.length+1),questions:[]};data.rounds.push(r);currentRoundId=r.id;render();scheduleSave();return;}if(btn.dataset.roundAction){mutateRound(btn.dataset.roundId,btn.dataset.roundAction);return;}if(btn.dataset.addQRound){addQuestion(btn.dataset.addQRound);return;}if(btn.id==='addQuestion'){addQuestion(currentRoundId);return;}if(btn.dataset.selectQ){currentQuestionId=btn.dataset.selectQ;currentRoundId=data.rounds.find(x=>x.questions.some(q=>q.id===currentQuestionId))?.id;render();return;}if(btn.dataset.qAction){mutateQuestion(btn.dataset.qAction);return;}if(btn.id==='removeImage'){if(question()){question().image='';render();scheduleSave();}return;}if(btn.id==='saveProjectBtn')saveJSON();if(btn.id==='loadProjectBtn')$('importInput').click();if(btn.id==='exportBtn')exportGame();if(btn.id==='previewBtn')preview();});
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));$('saveBtn').onclick=saveJSON;$('loadBtn').onclick=()=>$('importInput').click();$('exportTop').onclick=exportGame;$('importInput').onchange=e=>readProject(e.target.files[0]);
(async()=>{try{const previous=await dbLoad();if(previous&&Array.isArray(previous.rounds)){data=normalize(previous);currentRoundId=data.rounds[0]?.id||null;currentQuestionId=data.rounds[0]?.questions[0]?.id||null;$('saveStatus').textContent='Восстановлен последний проект';}}catch(e){try{const stored=JSON.parse(localStorage.getItem('istorya_builder_fallback'));if(stored){data=normalize(stored);currentRoundId=data.rounds[0]?.id||null;currentQuestionId=data.rounds[0]?.questions[0]?.id||null;}}catch(_){}}navHighlight();render();})();
})();
</script></body></html>
